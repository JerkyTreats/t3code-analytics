name: Container

on:
  push:
    branches:
      - "**"
    paths:
      - app/**
      - .github/workflows/container.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ghcr.io/jerkytreats/t3code-analytics:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        run: echo "${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
